<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curva Glicêmica Felina</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png"><link rel="manifest" href="/img/manifest.webmanifest"><meta name="theme-color" content="#7c5cff">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f4fb;--card:#fff;--tx:#1e1b2e;--mut:#6b6880;--pri:#7c5cff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--bd:#e7e3f3}
@media(prefers-color-scheme:dark){:root{--bg:#131220;--card:#1c1a2e;--tx:#f0eefb;--mut:#a09cba;--bd:#2d2a45}}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:980px;margin:0 auto;padding:32px 20px}h1{margin:0;font-size:1.8rem}.sub{color:var(--mut);margin:4px 0 24px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;box-shadow:0 6px 24px rgba(80,60,160,.07)}
label{display:block;font-size:.8rem;color:var(--mut);margin:0 0 6px;font-weight:600}
input[type=number],input[type=text],input[type=password],textarea{font-family:inherit;color-scheme:light dark;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:1rem}
input[type=time]::-webkit-calendar-picker-indicator{opacity:.6;cursor:pointer}input:focus{outline:2px solid var(--pri);border-color:transparent}
.toggle{display:flex;align-items:center;justify-content:space-between;margin:16px 0;padding:12px 14px;border-radius:14px;background:rgba(124,92,255,.08)}
.toggle input{width:20px;height:20px;accent-color:var(--pri)}.row{display:grid;grid-template-columns:1fr 1fr 32px 32px;gap:8px;margin-bottom:8px}
.row button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:1.1rem}
.btn{width:100%;padding:12px;border:0;border-radius:14px;font-weight:700;font-size:1rem;cursor:pointer}
.pri{background:var(--pri);color:#fff;margin-top:12px}.sec{background:transparent;border:1px dashed var(--bd);color:var(--mut)}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-size:.8rem;font-weight:700;background:rgba(124,92,255,.12);color:var(--pri)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat{padding:12px;border-radius:14px;background:rgba(124,92,255,.06);text-align:center}
.stat b{display:block;font-size:1.3rem}.stat span{font-size:.72rem;color:var(--mut)}
.alert{padding:12px 14px;border-radius:12px;background:rgba(220,38,38,.1);color:var(--bad);margin:8px 0;font-weight:600}
.item .nota{display:block;margin-top:4px;font-style:italic;color:var(--mut)}textarea{resize:vertical}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}.mini{border:0;background:rgba(124,92,255,.12);color:var(--pri);border-radius:10px;padding:6px 10px;margin-left:6px;cursor:pointer;font-weight:600}.pen{opacity:.4}.pen.on{opacity:1}.row .obs{grid-column:1/-1;font-size:.85rem;padding:8px 12px}.obsitem{padding:8px 12px;margin:6px 0;border-radius:12px;background:rgba(245,158,11,.12);font-size:.9rem}.hint{font-size:.78rem;color:var(--mut);margin-top:16px}#res{display:none}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--mut);font-weight:700;cursor:pointer}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}.who{display:flex;gap:10px;align-items:center;justify-content:space-between;color:var(--mut);margin:-8px 0 18px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
</style></head><body data-usuario='{{ usuario|tojson }}'><main>
<h1><img src="/img/favicon.svg" width="38" height="38" alt="" style="vertical-align:-9px;margin-right:6px">Curva Glicêmica Felina</h1><p class="sub">Registre as leituras e veja a análise com base na idade do gato.</p>
<div class="who" id="who"><span id="quem"></span><button class="mini" id="btnWho"></button></div>
<section class="card" id="auth" hidden style="max-width:420px;margin:0 auto 20px">
 <div class="tabs"><button id="tabE" class="on" onclick="tab('entrar')">Entrar</button><button id="tabC" onclick="tab('criar')">Criar conta</button></div>
 <label>Usuário</label><input id="u" type="text" autocomplete="username" autocapitalize="none" maxlength="30">
 <label style="margin-top:14px">Senha</label><input id="s" type="password" autocomplete="current-password" maxlength="128" onkeydown="if(event.key==='Enter')auth()">
 <div class="alert" id="autherr" hidden></div>
 <button class="btn pri" id="btnAuth" onclick="auth()">Entrar</button></section>
<div id="appui"><div class="grid">
<section class="card">
 <label>Idade do gato (anos)</label><input id="idade" type="number" min="0" step="0.1" value="3">
 <label style="margin-top:14px">Data da medição</label><input id="data" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" oninput="mask(this,'d')">
 <div class="toggle"><div><b>Uso de insulina</b><br><small style="color:var(--mut)">Marque se usa</small></div><input id="ins" type="checkbox" onchange="modo()"></div>
 <div class="row" style="margin:14px 0 4px"><label id="lblt">Horário da medição</label><label>Glicose (mg/dL)</label><span></span><span></span></div>
 <div id="rows"></div>
 <button class="btn sec" onclick="add()">+ Adicionar leitura</button>
 <button class="btn pri" onclick="analisar()">Analisar curva</button>
 <p class="hint">Ferramenta educativa. Não substitui avaliação veterinária.</p>
</section>
<section class="card"><canvas id="chart" height="260"></canvas>
 <div id="res"><span class="badge" id="faixa"></span><h2 id="tit" style="margin:10px 0 4px"></h2><p id="txt" style="margin:0;color:var(--mut)"></p>
 <div id="alerts"></div><div class="stats" id="stats"></div><div id="obs"></div><small style="color:var(--mut)" id="conf"></small><div class="acts"><button class="btn sec" onclick="baixarGrafico()">🖼️ Baixar gráfico</button><button class="btn sec" onclick="baixarResultado()">📄 Baixar resultado</button></div><button class="btn pri" id="btnSalvar" onclick="salvar()" hidden>💾 Salvar medição</button><p class="hint" id="dicaGuest" hidden>Modo visitante: entre na sua conta para salvar esta medição no histórico.</p></div>
</section></div>
<section class="card" id="histCard" hidden style="margin-top:20px"><h3 style="margin:0 0 6px">Histórico</h3><div id="hist"></div></section></div></main>
<script src="/js/app.js"></script></body></html>
