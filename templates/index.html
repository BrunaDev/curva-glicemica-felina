<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curva Glicêmica Felina</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f4fb;--card:#fff;--tx:#1e1b2e;--mut:#6b6880;--pri:#7c5cff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--bd:#e7e3f3}
@media(prefers-color-scheme:dark){:root{--bg:#131220;--card:#1c1a2e;--tx:#f0eefb;--mut:#a09cba;--bd:#2d2a45}}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:980px;margin:0 auto;padding:32px 20px}h1{margin:0;font-size:1.8rem}.sub{color:var(--mut);margin:4px 0 24px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;box-shadow:0 6px 24px rgba(80,60,160,.07)}
label{display:block;font-size:.8rem;color:var(--mut);margin:0 0 6px;font-weight:600}
input[type=number],input[type=text]{font-family:inherit;color-scheme:light dark;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:1rem}
input[type=time]::-webkit-calendar-picker-indicator{opacity:.6;cursor:pointer}input:focus{outline:2px solid var(--pri);border-color:transparent}
.toggle{display:flex;align-items:center;justify-content:space-between;margin:16px 0;padding:12px 14px;border-radius:14px;background:rgba(124,92,255,.08)}
.toggle input{width:20px;height:20px;accent-color:var(--pri)}.row{display:grid;grid-template-columns:1fr 1fr 32px;gap:8px;margin-bottom:8px}
.row button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:1.1rem}
.btn{width:100%;padding:12px;border:0;border-radius:14px;font-weight:700;font-size:1rem;cursor:pointer}
.pri{background:var(--pri);color:#fff;margin-top:12px}.sec{background:transparent;border:1px dashed var(--bd);color:var(--mut)}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-size:.8rem;font-weight:700;background:rgba(124,92,255,.12);color:var(--pri)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat{padding:12px;border-radius:14px;background:rgba(124,92,255,.06);text-align:center}
.stat b{display:block;font-size:1.3rem}.stat span{font-size:.72rem;color:var(--mut)}
.alert{padding:12px 14px;border-radius:12px;background:rgba(220,38,38,.1);color:var(--bad);margin:8px 0;font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}.mini{border:0;background:rgba(124,92,255,.12);color:var(--pri);border-radius:10px;padding:6px 10px;margin-left:6px;cursor:pointer;font-weight:600}.hint{font-size:.78rem;color:var(--mut);margin-top:16px}#res{display:none}
</style></head><body><main>
<h1>🐾 Curva Glicêmica Felina</h1><p class="sub">Registre as leituras e veja a análise com base na idade do gato.</p>
<div class="grid">
<section class="card">
 <label>Idade do gato (anos)</label><input id="idade" type="number" min="0" step="0.1" value="3">
 <label style="margin-top:14px">Data da medição</label><input id="data" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" oninput="mask(this,'d')">
 <div class="toggle"><div><b>Uso de insulina</b><br><small style="color:var(--mut)">Desmarque se não usa</small></div><input id="ins" type="checkbox" onchange="modo()"></div>
 <div class="row" style="margin-bottom:4px"><label id="lblt">Horário da medição</label><label>Glicose (mg/dL)</label><span></span></div>
 <div id="rows"></div>
 <button class="btn sec" onclick="add()">+ Adicionar leitura</button>
 <button class="btn pri" onclick="analisar()">Analisar curva</button>
 <p class="hint">Ferramenta educativa. Não substitui avaliação veterinária.</p>
</section>
<section class="card"><canvas id="chart" height="260"></canvas>
 <div id="res"><span class="badge" id="faixa"></span><h2 id="tit" style="margin:10px 0 4px"></h2><p id="txt" style="margin:0;color:var(--mut)"></p>
 <div id="alerts"></div><div class="stats" id="stats"></div><small style="color:var(--mut)" id="conf"></small><button class="btn pri" onclick="salvar()">💾 Salvar medição</button></div>
</section></div>
<section class="card" style="margin-top:20px"><h3 style="margin:0 0 6px">Histórico</h3><div id="hist"></div></section></main>
<script>
const $=id=>document.getElementById(id);let chart;
const DEF_INS=[0,2,4,6],DEF_CLK=["08:00","10:00","12:00","14:00"];
function add(t="",g=""){const ins=$("ins").checked,r=document.createElement("div");r.className="row";
r.innerHTML=`<input ${ins?'type="number" step="0.5" min="0"':'type="text" inputmode="numeric" maxlength="5" placeholder="hh:mm" oninput="mask(this,\'h\')"'} value="${t}"><input type=number min=10 max=800 value="${g}"><button onclick="this.parentNode.remove()">✕</button>`;$("rows").appendChild(r)}
function modo(){const ins=$("ins").checked,def=ins?DEF_INS:DEF_CLK;
 $("lblt").textContent=ins?"Horas após a insulina":"Horário da medição";
 const gs=[...$("rows").children].map(r=>r.children[1].value),n=Math.max(4,gs.length);
 $("rows").innerHTML="";for(let i=0;i<n;i++)add(def[i]??"",gs[i]||"")}
modo();
async function analisar(){
 const ins=$("ins").checked;
 const rows=[...$("rows").children].map(r=>({a:r.children[0].value,g:r.children[1].value})).filter(x=>x.a!==""&&x.g!=="");
 if(!ins&&rows.some(x=>!/^([01]\d|2[0-3]):[0-5]\d$/.test(x.a)))return alert("Use horários válidos no formato 24h (ex.: 08:30).");
 let leituras;
 if(ins){leituras=rows.map(x=>({t:+x.a,g:+x.g,l:x.a}))}
 else{let prev=-1,off=0,base=null;
  leituras=rows.map(x=>{const[h,m]=x.a.split(":").map(Number);let min=h*60+m+off;
   if(prev>=0&&min<prev){off+=1440;min+=1440}prev=min;if(base===null)base=min;
   return{t:(min-base)/60,g:+x.g,l:x.a}})}
 const res=await fetch("/api/analisar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({idade:$("idade").value,insulina:ins,leituras:leituras.map(x=>({t:x.t,g:x.g}))})});
 const d=await res.json();if(!res.ok)return alert(d.erro);
 if(ins)leituras.sort((a,b)=>a.t-b.t);
 const xs=leituras.map(p=>ins?p.t:p.l),f=d.faixa;
 if(chart)chart.destroy();
 chart=new Chart($("chart"),{type:"line",data:{labels:xs,datasets:[
  {label:"Mín",data:xs.map(_=>f.min),borderWidth:0,pointRadius:0,fill:false},
  {label:`Faixa ${f.min}–${f.max}`,data:xs.map(_=>f.max),borderWidth:0,pointRadius:0,fill:"-1",backgroundColor:"rgba(22,163,74,.13)"},
  {label:"Glicose",data:leituras.map(p=>p.g),borderColor:"#7c5cff",backgroundColor:"#7c5cff",tension:.35,borderWidth:3,pointRadius:5}]},
  options:{plugins:{legend:{labels:{filter:i=>i.text!=="Mín"}}},scales:{x:{title:{display:true,text:ins?"Horas após a insulina":"Horário da medição"}},y:{title:{display:true,text:"mg/dL"},suggestedMin:0}}}});
 $("res").style.display="block";$("faixa").textContent=f.nome+` · ${f.min}–${f.max} mg/dL`;
 $("tit").textContent=d.titulo;$("txt").textContent=d.texto;
 $("alerts").innerHTML=d.alertas.map(a=>`<div class="alert">⚠️ ${a}</div>`).join("");
 const s=d.resumo;$("stats").innerHTML=[["Média",s.media],["Máxima",s.maxima],["Mínima (nadir)",s.minima],["Na faixa",s.no_alvo+"%"]].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
 $("conf").textContent=`Confiança do modelo: ${d.confianca}%`;ultima={rows,titulo:d.titulo,classe:d.classe,resumo:d.resumo}}
function mask(el,t){let v=el.value.replace(/\D/g,"");
 v=t==="d"?v.slice(0,8).replace(/^(\d{2})(\d)/,"$1/$2").replace(/^(\d{2}\/\d{2})(\d)/,"$1/$2"):v.slice(0,4).replace(/^(\d{2})(\d)/,"$1:$2");el.value=v}
const isoToBr=d=>d.split("-").reverse().join("/"),brToIso=d=>d.split("/").reverse().join("-");
function dataOk(d){const m=d.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(!m)return false;const x=new Date(+m[3],m[2]-1,+m[1]);return x.getMonth()==m[2]-1&&x.getDate()==+m[1]}
let ultima=null;$("data").value=new Date().toLocaleDateString("pt-BR");
async function api(u,o={}){const h={"Content-Type":"application/json","X-Senha":sessionStorage.getItem("senha")||""};
 let r=await fetch(u,{...o,headers:h});
 if(r.status===401){const s=prompt("Senha de acesso:");if(!s)return r;sessionStorage.setItem("senha",s);h["X-Senha"]=s;r=await fetch(u,{...o,headers:h})}
 return r}
async function salvar(){if(!ultima)return;if(!dataOk($("data").value))return alert("Use uma data válida no formato dd/mm/aaaa.");
 const r=await api("/api/medicoes",{method:"POST",body:JSON.stringify({data:brToIso($("data").value),idade:$("idade").value,insulina:$("ins").checked,...ultima})});
 if(!r.ok)return alert((await r.json()).erro||"Erro ao salvar");hist()}
async function hist(){const r=await api("/api/medicoes");if(!r.ok){$("hist").textContent="Não foi possível carregar o histórico.";return}
 const L=window._L=await r.json();
 $("hist").innerHTML=L.length?L.map(m=>`<div class="item"><div><b>${m.data.split("-").reverse().join("/")}</b> · ${m.idade} ano(s) · ${m.insulina?"com":"sem"} insulina<br><small style="color:var(--mut)">${m.titulo} · média ${Math.round(m.resumo.media)} mg/dL</small></div><div><button class="mini" onclick="abrir('${m.id}')">Abrir</button><button class="mini" onclick="excluir('${m.id}')">✕</button></div></div>`).join(""):'<small style="color:var(--mut)">Nenhuma medição salva ainda.</small>'}
function abrir(id){const m=window._L.find(x=>x.id===id);$("idade").value=m.idade;$("data").value=isoToBr(m.data);$("ins").checked=m.insulina;modo();$("rows").innerHTML="";m.rows.forEach(x=>add(x.a,x.g));analisar()}
async function excluir(id){if(!confirm("Excluir esta medição?"))return;await api("/api/medicoes/"+id,{method:"DELETE"});hist()}
hist();
</script></body></html>
